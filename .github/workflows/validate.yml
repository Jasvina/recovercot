name: validate

on:
  push:
  pull_request:

jobs:
  python-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sample validations
        run: |
          make validate-sample
          make sample-pipeline
          make build-sample-records
          make eval-sample
          make build-sample-sft
          make benchmark-samples
          make build-sample-manifest
          make bootstrap-sample-run
          make validate-committed-artifacts
